[project]
name = "pretix-google-wallet"
dynamic = ["version"]
description = "Google Wallet event tickets for pretix"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    {name = "Jan Pohanka"},
]
dependencies = [
    "google-auth[requests]>=2.0",
    "pretix>=2026.7.0.dev0",
]

[project.entry-points."pretix.plugin"]
pretix_google_wallet = "pretix_google_wallet:PretixPluginMeta"

[project.urls]
Homepage = "https://github.com/xhpohanka/pretix-google-wallet"

[build-system]
requires = ["setuptools", "pretix-plugin-build"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "pretix_google_wallet.__version__"}

[tool.setuptools.packages.find]
include = ["pretix_google_wallet*"]

